name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory_dev_password
          POSTGRES_DB: memory_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U memory -d memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install ".[dev]"

      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://memory:memory_dev_password@localhost:5433/memory_test

      - run: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://memory:memory_dev_password@localhost:5433/memory_test
          AUTH_MODE: dev
          DEV_BEARER_TOKEN: test-token
