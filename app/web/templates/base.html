<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}memory-service{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx/htmx.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">memory-service</a>
    <form class="topbar-search" action="/search" method="get">
      <input type="search" name="q" placeholder="Suche..." value="{{ query|default('') }}">
    </form>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
