services:
  db:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory_dev_password
      POSTGRES_DB: memory
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://memory:memory_dev_password@db:5432/memory
      GIT_REPO_PATH: /data/git-repo
      AUTH_MODE: dev
      DEV_BEARER_TOKEN: dev-local-token
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  app_data:
